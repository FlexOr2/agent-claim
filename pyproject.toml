[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-claim"
dynamic = ["version"]
description = "Repository-neutral GitHub issue claims for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "agent-claim contributors"}]

[project.scripts]
agent-claim = "agent_claim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "agent_claim.__version__"}

# uv invalidates builds of path sources only via pyproject.toml's mtime by
# default, so `uv tool install --from .` can silently reinstall a cached wheel
# from an older commit (issue #70). Keying the cache on the git commit makes
# every landing invalidate it.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# PLR0911 (too-many-return-statements), PLR0912 (too-many-branches) and
# PLR0915 (too-many-statements) stay unselected: the functions they would
# flag today (main, _bounded_command, bootstrap_ledger, _board_blocker,
# build_board, parse_contract, parse_slice_table,
# _acquire_claim_with_observed, _apply_derived_resource_holds,
# _aggregate_claim_events, release_claim) are the open complexity slices
# #117/#119; re-enable once those land.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "FURB", "N"]
ignore = [
    "PLR0911",
    "PLR0912",
    "PLR0915",
    # `configure_ledger` binds the process-wide ledger issue number once, at
    # startup, before any CLI action runs -- the one deliberate module-level
    # configuration global in the codebase, not a state bug awaiting a
    # refactor. Permanent policy, unlike the PLR091x exclusions above.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
# Test literals are scenario data, not domain magic numbers; a pytest test
# function's parameter list is shaped by fixture injection and
# `parametrize`, not a free design choice, so its argument count isn't a
# design smell the way a production function's is.
"tests/**" = ["PLR2004", "PLR0913", "PLR0917"]
# `build_board` is the open complexity slices #117/#119's function (see the
# comment above); its argument count is part of the same pending redesign.
"src/agent_claim/board.py" = ["PLR0913"]
# `release_claim` is #117/#119's function, same as above. `rescope_claim` and
# `supersede_ledger` are public protocol entry points pinned by many direct
# tests; grouping their arguments would ripple through every call site for a
# CI-gate slice that fixes lint findings, not redesigns the protocol surface
# -- report to the head instead of forcing it here.
"src/agent_claim/protocol.py" = ["PLR0913", "PLR0917"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
