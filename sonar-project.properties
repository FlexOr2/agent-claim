# python:S3516 - these are CLI command functions whose return value is the
# fixed exit code of a result (always 0 or always 2); the observable effect
# differs via print, not the return value. That is this file's CLI idiom, not
# a dead branch. See distributor issue #103.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.e1.resourceKey=src/agent_claim/cli.py

# python:S8495 - the return type is explicitly tuple[SliceCheck, ...], a
# homogeneous variable-length sequence (0 or 1 checks), not a fixed-arity
# record tuple. Callers use .extend(...), never positional unpacking. See
# distributor issue #103.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S8495
sonar.issue.ignore.multicriteria.e2.resourceKey=src/agent_claim/cli.py

# python:S8786 - FROZEN_LINE_PATTERN was measured empirically linear up to
# 100,000 characters of adversarial input (~11ms); the mandatory '>' consumed
# in every repetition rules out catastrophic backtracking. Verified false
# positive. See distributor issue #103.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S8786
sonar.issue.ignore.multicriteria.e3.resourceKey=src/agent_claim/board.py

# pythonsecurity:S8705 - command is a list[str] and shell=True is never set,
